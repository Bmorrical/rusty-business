[package]
name = "rusty-business"
version = "0.8.5"
description = "A desktop window for models that run on this computer"
edition = "2024"
license = "MIT"
homepage = "https://rusty.business"
repository = "https://github.com/Bmorrical/rusty-business"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_business_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain http to the engine on this computer. Past it, only through the
# outbound gate (src/gate.rs): https to Hugging Face only, for downloads,
# https to GitHub's API only, for the check for a new version, and https to
# xAI's API only, with the person's own key, to ask Grok, and https to Brave
# Search's API or DuckDuckGo's results page only, for web search, through the
# system's own TLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
# The `board` command runs without the app, so it finds the app's data folder
# itself. This is the crate Tauri finds it with, so it is built once.
dirs = "7"
sha2 = "0.10"
libc = "0.2"
# Attachments: the text of PDFs, Word files, and spreadsheets, read on this
# computer. zip is the version calamine already uses, so it is built once.
calamine = "0.38"
pdf-extract = "0.12.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Uninstall: a model's files go to the system's Trash, or the Recycle Bin on
# Windows, where the person can take them back. Nothing is deleted.
trash = "5.4"
# Install and restart: checks a new version's signature against the public key
# in tauri.conf.json, then installs it. No features, so it makes no connection
# of its own: update.rs fetches the files through the outbound gate and hands
# it the bytes.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls"] }
# The picture check (picture.rs): a small vision model that scores a picture
# on this computer, in memory. candle runs the model, and image decodes the
# picture. 0.11 rather than 0.9: 0.9 brings an old zip with open advisories.
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# The boards' database (store.rs): one SQLite file in the boards folder,
# encrypted whole by SQLCipher, built into the app. On a Mac the cipher is
# Apple's own, so nothing new is installed; on Linux it is the system's
# OpenSSL, which the app already links.
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
# The database's key, kept in the system's key store: the Keychain on a Mac,
# the Credential Manager on Windows, and the Secret Service on Linux.
keyring = "4.2"
# The key's 32 random bytes, from the system. Already built for other crates.
getrandom = "0.3"

# Windows has no system OpenSSL, so SQLCipher builds its own copy there.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Panics unwind, so a file that breaks the PDF reader costs one attachment,
# not the app: see attachments.rs.
panic = "unwind"
strip = true
