[package]
name = "rusty-business"
version = "0.3.0"
description = "A desktop window for models that run on this computer"
edition = "2024"
license = "MIT"
homepage = "https://rusty.business"
repository = "https://github.com/Bmorrical/rusty-business"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_business_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain http to the engine on this computer, and https to Hugging Face only,
# for downloads, through the system's own TLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
