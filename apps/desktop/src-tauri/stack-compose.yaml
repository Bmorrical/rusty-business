# The stack the desktop app starts. It is infra/compose.yaml with three
# changes, and scripts/app-stack.test.mjs keeps the two in step:
#
# - the API and the worker are pulled from GitHub's container registry,
#   pinned by digest, in place of being built here;
# - only the front door has a port on this computer, since it is the one
#   address the app uses. It is port 4700, as in the stack `make up` starts,
#   so one of the two runs at a time; when that one answers, the app starts
#   nothing;
# - its settings come from the app's data folder, where the app writes this
#   file, the front door's Caddyfile, and stack.env (with new random
#   passwords, on the first start only).
#
# The front door binds to 127.0.0.1, so nothing here can be reached from
# another machine.

name: rusty-business-app

x-own-service: &own-service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-check-timing: &check-timing
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s
  start_interval: 1s

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing in the app's stack.env}
      POSTGRES_USER: ${POSTGRES_USER:?missing in the app's stack.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in the app's stack.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Asked over TCP on purpose: while the image is still setting the
      # database up, it answers on its socket file only.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$${POSTGRES_USER}\" --dbname \"$${POSTGRES_DB}\""]
      <<: *check-timing

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?missing in the app's stack.env}", "--appendonly", "yes"]
    environment:
      # Read by redis-cli, for the health check below.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      <<: *check-timing

  # File storage that speaks the S3 protocol.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?missing in the app's stack.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?missing in the app's stack.env}
      # Lets the mc tool inside this container reach the server as "local".
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *check-timing

  # A one-off job, not part of `up`: makes the bucket if it is not there
  # yet, then exits. The app runs it once the stack is healthy. It sits
  # behind a profile because `up --wait` counts any container that exits,
  # even cleanly, as a failure.
  minio-bucket:
    profiles: [setup]
    image: cgr.dev/chainguard/minio:latest
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["mc", "mb", "--ignore-existing"]
    command: ["local/${MINIO_BUCKET:-rusty-business}"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio:
        condition: service_healthy

  # Catches every email the stack sends. Nothing leaves this computer.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    <<: *own-service
    # Built from commit 9821050 by Deploy. A new build is pinned here by
    # hand, with its digest from the run's summary.
    image: ghcr.io/bmorrical/rusty-business/api:sha-9821050c32f69a93fd7177d7decd7ebf80070507@sha256:2095df44bd000db3ec1d25094b6567abeb9f4b06777495ec3d84404535e1fbb9
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Inside its container the API listens on every address; only the
      # front door reaches it.
      API_BIND: 0.0.0.0
      API_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "healthcheck"]
      <<: *check-timing

  worker:
    <<: *own-service
    image: ghcr.io/bmorrical/rusty-business/worker:sha-9821050c32f69a93fd7177d7decd7ebf80070507@sha256:9ac38ac24a509cea83e4e2d18edf36ad31607f7aff66e54628c8c3f84aa97d8c
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "healthcheck"]
      <<: *check-timing

  # The front door: the one address the desktop app uses.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    environment:
      # Caddy keeps its own files here; both are throwaway.
      XDG_DATA_HOME: /tmp/caddy/data
      XDG_CONFIG_HOME: /tmp/caddy/config
    tmpfs:
      - /tmp:mode=1777
    ports:
      - "127.0.0.1:${PORT_FRONT_DOOR:-4700}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/front-door"]
      <<: *check-timing

volumes:
  postgres-data:
  redis-data:
  minio-data:
