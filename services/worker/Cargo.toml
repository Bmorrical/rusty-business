[package]
name = "rusty-worker"
description = "The worker: waits on the job queue and does nothing with a job yet"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp"] }
rusty-shared = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
