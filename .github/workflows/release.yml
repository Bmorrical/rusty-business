# Release. It runs only on request, only from main, and its first job is the
# gate. Every other job needs the gate, so a red gate stops the run before
# anything goes out.
#
# What goes out, on a GitHub release named for the app's version: the Mac
# app, as a .dmg with the model engine inside, the Windows installer, as an
# .exe, and the Linux app, as a .deb, an .rpm, and a .tar.gz, each with its
# checksum. The README links the newest release's five. A Mac, a Windows
# computer, and a Linux computer each build theirs with the same command a
# person runs, and the last job, the only one that may write, publishes
# them. A release that is out is never changed: for a version already
# tagged, the run stops.
#
# Install and restart reads two more: the Mac app as a .app.tar.gz, which
# the mac job packs beside the .dmg, and latest.json, which names each file a
# copy installs over and holds its signature. The updater job makes
# latest.json with scripts/updater.mjs and the release environment's Tauri
# key, and the publish job checks every signature against the public key in
# tauri.conf.json before the release goes out.
#
# The Mac's signing is a switch, off to start: the release environment's
# MAC_SIGNING variable. The sign job, on a Mac of its own, takes the .dmg the
# mac job built. While the switch is off, the .dmg goes on as `make dmg` made
# it, signed for itself alone, and the release notes give the steps to open
# it. With it on, scripts/mac-sign.sh signs the app and the .dmg with a
# Developer ID and has Apple notarize both, from the environment's secrets,
# and a missing secret stops the run.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gate.yml

  mac:
    name: Build the Mac app
    needs: gate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app with its engine inside, and pack the .dmg and the .app.tar.gz
        run: make dmg
      - name: Keep the .dmg, the .app.tar.gz, and their checksums for the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dmg-built
          path: |
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.dmg
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.dmg.sha256
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.app.tar.gz
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.app.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign the Mac app, when the switch is on
    needs: [gate, mac]
    runs-on: macos-15
    timeout-minutes: 90
    # The Mac's signing secrets and the switch live in the release
    # environment, which runs only from main. Only this job is handed them, on
    # a Mac of its own, so nothing the build fetched or ran is there to see
    # them.
    environment: release
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dmg-built
          path: apps/desktop/src-tauri/target/mac
      - name: Sign and notarize the app and the .dmg, when the switch is on
        id: sign
        env:
          MAC_SIGNING: ${{ vars.MAC_SIGNING }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
        run: scripts/mac-sign.sh
      - name: Keep the .dmg, the .app.tar.gz, and their checksums for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dmg
          path: |
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.dmg
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.dmg.sha256
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.app.tar.gz
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.app.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Build the Windows app
    needs: gate
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        shell: bash
        run: bash scripts/windows-app.sh
      - name: Keep the .exe and its checksum for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: |
            apps/desktop/src-tauri/target/windows/Rusty-Business-windows-x64-setup.exe
            apps/desktop/src-tauri/target/windows/Rusty-Business-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux:
    name: Build the Linux app
    needs: gate
    runs-on: ubuntu-24.04
    # Built in Ubuntu 22.04, the oldest system the packages are for: a program
    # built against a newer C library does not start on an older one. GitHub
    # is retiring its own 22.04 computers, so the build runs in 22.04's image
    # instead, pinned by digest.
    container: ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK, OpenSSL, and a C compiler
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates build-essential curl pkg-config libwebkit2gtk-4.1-dev libssl-dev
      - name: Build the .deb, the .rpm, and the .tar.gz
        run: bash scripts/linux-app.sh
      - name: Keep the three and their checksums for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            apps/desktop/src-tauri/target/linux/Rusty-Business-linux-x64.deb
            apps/desktop/src-tauri/target/linux/Rusty-Business-linux-x64.deb.sha256
            apps/desktop/src-tauri/target/linux/Rusty-Business-linux-x64.rpm
            apps/desktop/src-tauri/target/linux/Rusty-Business-linux-x64.rpm.sha256
            apps/desktop/src-tauri/target/linux/Rusty-Business-linux-x64.tar.gz
            apps/desktop/src-tauri/target/linux/Rusty-Business-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  updater:
    name: Sign the files Install and restart puts in place
    needs: [gate, sign, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The Tauri key that signs them, and its password, live in the release
    # environment, which runs only from main. Only this job is handed them, on
    # a computer of its own that builds nothing, and only its one step reads
    # them: scripts/updater.mjs, which uses Node's own crypto and nothing
    # fetched. Only latest.json leaves the job.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dmg
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - name: Sign the four files, and make latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/updater.mjs sign dist
      - name: Keep latest.json for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater
          path: dist/latest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: [gate, mac, sign, windows, linux, updater]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that may write anything, and only the repository's
    # contents: it makes the release and its tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dmg
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater
          path: dist
      - name: Check latest.json, and each signature in it
        run: node scripts/updater.mjs check dist
      - name: Check the checksums, and make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGNED: ${{ needs.sign.outputs.signed }}
        run: scripts/release.sh publish dist
