# Release. It runs only on request, only from main, and its first job is the
# gate. Every other job needs the gate, so a red gate stops the run before
# anything goes out.
#
# What goes out, on a GitHub release named for the app's version: the Mac
# app, as a .dmg with the model engine inside, and the Windows installer, as
# an .exe, each with its checksum. The README links the newest release's
# two. A Mac and a Windows computer each build theirs with the same command
# a person runs, and the last job, the only one that may write, publishes
# them. A release that is out is never changed: for a version already
# tagged, the run stops.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gate.yml

  mac:
    name: Build the Mac app
    needs: gate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app with its engine inside, and pack the .dmg
        run: make dmg
      - name: Keep the .dmg and its checksum for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dmg
          path: |
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.dmg
            apps/desktop/src-tauri/target/mac/Rusty-Business-mac-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Build the Windows app
    needs: gate
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        shell: bash
        run: bash scripts/windows-app.sh
      - name: Keep the .exe and its checksum for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: |
            apps/desktop/src-tauri/target/windows/Rusty-Business-windows-x64-setup.exe
            apps/desktop/src-tauri/target/windows/Rusty-Business-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish the release
    needs: [gate, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that may write anything, and only the repository's
    # contents: it makes the release and its tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dmg
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: dist
      - name: Check the checksums, and make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release.sh publish dist
